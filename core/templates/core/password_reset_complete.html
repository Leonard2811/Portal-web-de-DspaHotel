{% extends 'core/base.html' %}
{% load static %}

{% block title %}Contraseña Restablecida - D'Spa Hotel{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card text-center">
                    <div class="auth-header">
                        <div class="mb-4">
                            <i class="fas fa-check-circle fa-4x text-success"></i>
                        </div>
                        <h2>¡Contraseña Actualizada!</h2>
                        <p>Su contraseña ha sido restablecida exitosamente.</p>
                    </div>
                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-reservation w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión Ahora
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
